title = "Scanner de segredos do chatbot"

[extend]
useDefault = true

[allowlist]
# Python bytecode can join fragments used to build fake test credentials.
paths = [
  '''(^|/)__pycache__/''',
  '''\.pyc$''',
]

[[rules]]
id = "chatbot-openrouter-api-key"
description = "Chave da API OpenRouter"
regex = '''sk-or-v1-[A-Za-z0-9_-]{20,}'''
keywords = ["sk-or-v1-"]

[[rules]]
id = "chatbot-anthropic-api-key"
description = "Chave da API Anthropic"
regex = '''sk-ant-api[0-9]{2}-[A-Za-z0-9_-]{20,}'''
keywords = ["sk-ant-api"]

[[rules]]
id = "chatbot-openai-project-key"
description = "Chave de projeto da API OpenAI"
regex = '''sk-proj-[A-Za-z0-9_-]{20,}'''
keywords = ["sk-proj-"]
