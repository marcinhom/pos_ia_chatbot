name: Validacao CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar:
    name: Validar configuração, testes e segredos
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código e o histórico Git
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Preparar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Instalar dependências de validação
        run: python -m pip install -r requirements-dev.txt

      - name: Validar a configuração do assistente
        run: python config_loader.py

      - name: Executar testes automatizados
        run: python -m pytest -q

      - name: Procurar chaves e tokens no repositório
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  publicar-space:
    name: Publicar no Hugging Face Space
    needs: validar
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Conferir configuração de publicação
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_ID: ${{ vars.HF_SPACE_ID }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::error::Configure o Secret HF_TOKEN nas configurações do GitHub Actions."
            exit 1
          fi
          if ! [[ "$HF_SPACE_ID" =~ ^[^/]+/[^/]+$ ]]; then
            echo "::error::Configure a variável HF_SPACE_ID no formato conta/nome-do-space."
            exit 1
          fi

      - name: Sincronizar arquivos com o Space
        uses: huggingface/hub-sync@v0.3.0
        with:
          github_repo_id: ${{ github.repository }}
          huggingface_repo_id: ${{ vars.HF_SPACE_ID }}
          hf_token: ${{ secrets.HF_TOKEN }}
          space_sdk: gradio
